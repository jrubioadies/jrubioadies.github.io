<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3524">
<meta name="description" content="Othello para jugar en el móvil, contra la CPU o a dos jugadores.">
<meta property="og:title" content="Othello de Bolsillo">
<meta property="og:description" content="El clásico de mesa en tu móvil. Contra la CPU o con un amigo, sin descargar nada.">
<title>Othello de Bolsillo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen table — scoreboard, felt board with a–h / 1–8 rails, move strip, controls. */
:root {
  --bg: #e4e8e1;
  --surface: #f3f5f1;
  --ink: #18221c;
  --muted: #5d6b62;
  --line: #c7cfc6;
  --felt: #1d6a46;
  --felt-dark: #134a31;
  --frame: #0f3524;
  --brass: #b88a2e;
  --brass-soft: rgba(184, 138, 46, .18);
  --danger: #b4452f;
  --font-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1411; --surface: #17201b; --ink: #e5ebe6; --muted: #93a398; --line: #2a372f;
    --felt: #1a5f3f; --felt-dark: #10402a; --frame: #07130d; --brass: #d6aa52; --brass-soft: rgba(214, 170, 82, .16);
    --danger: #e0735b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1411; --surface: #17201b; --ink: #e5ebe6; --muted: #93a398; --line: #2a372f;
  --felt: #1a5f3f; --felt-dark: #10402a; --frame: #07130d; --brass: #d6aa52; --brass-soft: rgba(214, 170, 82, .16);
  --danger: #e0735b; color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; color-scheme: light; }
body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  overflow-x: hidden;
}
.app {
  min-height: 100%;
  box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  --bs: min(100%, max(264px, min(540px, calc(100dvh - 300px))));
}
.top, .scores, .status, .board-frame, .strip, .controls { width: var(--bs); max-width: 100%; box-sizing: border-box; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.6rem;
  letter-spacing: .02em;
  text-transform: uppercase;
  margin: 0;
  line-height: 1;
}
.brand span { color: var(--brass); }
.mode-tag { font-size: .78rem; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-left: auto; }
.sound {
  flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0;
}
.sound svg { width: 18px; height: 18px; }
.sound .off { display: none; }
.sound[aria-pressed="false"] .on { display: none; }
.sound[aria-pressed="false"] .off { display: block; }
.sound[aria-pressed="false"] { color: var(--muted); }
.sound:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }

.scores { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.player {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 12px;
  background: var(--surface);
  border: 2px solid transparent;
  transition: border-color .25s, background .25s;
}
.player.active { border-color: var(--brass); background: linear-gradient(var(--brass-soft), var(--brass-soft)), var(--surface); }
.chip { width: 22px; height: 22px; border-radius: 50%; }
.chip.b { background: radial-gradient(circle at 35% 30%, #575757, #0b0b0b 70%); box-shadow: 0 1px 2px rgba(0,0,0,.4); }
.chip.w { background: radial-gradient(circle at 35% 30%, #ffffff, #d4d8d1 75%); box-shadow: 0 1px 2px rgba(0,0,0,.35), inset 0 0 0 1px rgba(0,0,0,.08); }
.pname { font-weight: 600; font-size: .9rem; line-height: 1.15; min-width: 0; }
.pname small { display: block; font-weight: 400; color: var(--muted); font-size: .74rem; }
.count {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 2.1rem;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.status {
  min-height: 1.4em;
  text-align: center;
  font-weight: 500;
  color: var(--ink);
  font-size: .95rem;
}
.status.notice { color: var(--danger); }
.status .dots::after { content: "…"; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }

.board-frame {
  position: relative;
  background: var(--frame);
  border-radius: 14px;
  padding: 6px 6px 6px 6px;
  display: grid;
  grid-template-columns: 14px 1fr;
  grid-template-rows: 14px 1fr;
  gap: 3px;
  box-shadow: 0 10px 28px -12px rgba(0,0,0,.55);
}
.rail { display: grid; font-family: var(--font-display); font-weight: 700; font-size: .72rem; color: var(--brass); opacity: .85; text-transform: lowercase; }
.rail.cols { grid-column: 2; grid-template-columns: repeat(8, 1fr); text-align: center; align-items: center; }
.rail.rows { grid-row: 2; grid-template-rows: repeat(8, 1fr); align-items: center; justify-items: center; }
.corner { grid-row: 1; grid-column: 1; }
.board {
  grid-row: 2; grid-column: 2;
  aspect-ratio: 1;
  max-width: 100%;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
  gap: 2px;
  background: var(--felt-dark);
  border: 2px solid var(--felt-dark);
  border-radius: 4px;
  position: relative;
}
.cell {
  position: relative;
  background: var(--felt);
  border: 0;
  padding: 0;
  margin: 0;
  cursor: default;
  perspective: 400px;
  outline: none;
}
.cell.legal { cursor: pointer; }
.cell:focus-visible { box-shadow: inset 0 0 0 3px var(--brass); z-index: 1; }
/* The four star points that mark the centre squares on a real Othello board. */
.star {
  position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--felt-dark);
  translate: -50% -50%; z-index: 3; pointer-events: none;
}
.board.hints .cell.legal::after {
  content: ""; position: absolute; inset: 36%; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.38);
  pointer-events: none;
}
.board.hints .cell.legal:active::after { background: rgba(255,255,255,.25); }

.disc {
  position: absolute; inset: 9%;
  transform-style: preserve-3d;
  transition: transform .42s cubic-bezier(.4, .1, .3, 1.3);
  opacity: 0;
  pointer-events: none;
}
.disc[data-c="b"], .disc[data-c="w"] { opacity: 1; }
.disc[data-c="w"] { transform: rotateY(180deg); }
.disc.instant { transition: none; }
.disc.pop { animation: pop .28s ease-out; }
@keyframes pop { from { scale: .4; } 70% { scale: 1.08; } to { scale: 1; } }
.face {
  position: absolute; inset: 0; border-radius: 50%;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  box-shadow: 0 2px 3px rgba(0,0,0,.45);
}
.face.b { background: radial-gradient(circle at 35% 30%, #575757, #0b0b0b 68%); }
.face.w { background: radial-gradient(circle at 35% 30%, #ffffff, #d4d8d1 75%); transform: rotateY(180deg); }
.cell.last .disc::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: 18%; height: 18%;
  translate: -50% -50%; border-radius: 50%; background: var(--danger); transform: translateZ(1px);
}
.disc[data-c="w"]::after { transform: rotateY(180deg) translateZ(1px) !important; }

.result {
  position: absolute; inset: 0; display: grid; place-items: center;
  background: rgba(7, 19, 13, .55); border-radius: 14px; z-index: 5;
}
.result-card {
  background: var(--surface); color: var(--ink); border-radius: 16px; padding: 20px 22px;
  text-align: center; display: grid; gap: 10px; width: min(80%, 300px); box-sizing: border-box;
  box-shadow: 0 16px 40px -10px rgba(0,0,0,.6);
}
.result-card h2 { font-family: var(--font-display); font-weight: 800; font-size: 2rem; text-transform: uppercase; margin: 0; line-height: 1; text-wrap: balance; }
.result-card p { margin: 0; color: var(--muted); font-variant-numeric: tabular-nums; }

.strip {
  display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
  font-variant-numeric: tabular-nums; font-size: .8rem; color: var(--muted);
  min-height: 26px; align-items: center;
}
.strip::-webkit-scrollbar { display: none; }
.strip .label { text-transform: uppercase; letter-spacing: .08em; font-size: .7rem; flex: none; }
.mv { flex: none; display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px; border-radius: 999px; background: var(--surface); color: var(--ink); }
.mv .chip { width: 10px; height: 10px; }
.mv.pass { color: var(--muted); font-style: italic; }

.controls { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 8px; }
button.btn {
  font: inherit; font-weight: 600; font-size: .9rem;
  border-radius: 12px; padding: 12px 10px; cursor: pointer;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line);
}
button.btn:disabled { opacity: .45; cursor: default; }
button.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button.btn[aria-pressed="true"] { border-color: var(--brass); box-shadow: inset 0 0 0 1px var(--brass); }
button.btn:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }

.sheet-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20;
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  width: 100%; max-width: 560px; box-sizing: border-box; background: var(--surface);
  border-radius: 20px 20px 0 0; display: grid; gap: 18px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 20px calc(20px + env(safe-area-inset-bottom, 0px));
  animation: rise .25s ease-out;
}
@keyframes rise { from { transform: translateY(30px); opacity: 0; } }
.sheet h2 { margin: 0; font-family: var(--font-display); font-weight: 800; text-transform: uppercase; font-size: 1.7rem; line-height: 1; }
.field { display: grid; gap: 8px; border: 0; padding: 0; margin: 0; }
.field legend { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 0; margin-bottom: 8px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label {
  text-align: center; padding: 11px 6px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); font-weight: 500; cursor: pointer; font-size: .9rem;
}
.seg input:checked + label { border-color: var(--brass); background: var(--brass-soft); font-weight: 600; }
.seg input:focus-visible + label { outline: 3px solid var(--brass); outline-offset: 2px; }
select.lang {
  font: inherit; font-size: .95rem; padding: 11px 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); width: 100%;
}
select.lang:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
.sheet-actions { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }

@media (prefers-reduced-motion: reduce) {
  .disc { transition: none; }
  .disc.pop, .sheet, .status .dots::after { animation: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="brand">Othello<span>.</span></h1>
    <div class="mode-tag" id="modeTag"></div>
    <button class="sound" id="sound" type="button" aria-pressed="true" data-i18n-aria="sound" aria-label="Sonido">
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
    </button>
  </header>

  <section class="scores" data-i18n-aria="score" aria-label="Marcador">
    <div class="player" id="p1">
      <div class="chip b"></div>
      <div class="pname"><span data-i18n="black">Negras</span><small id="n1">Tú</small></div>
      <div class="count" id="c1">2</div>
    </div>
    <div class="player" id="p2">
      <div class="chip w"></div>
      <div class="pname"><span data-i18n="white">Blancas</span><small id="n2">CPU</small></div>
      <div class="count" id="c2">2</div>
    </div>
  </section>

  <div class="status" id="status" role="status" aria-live="polite"></div>

  <div class="board-frame">
    <div class="corner"></div>
    <div class="rail cols" aria-hidden="true"><span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span></div>
    <div class="rail rows" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span></div>
    <div class="board hints" id="board" role="grid" data-i18n-aria="board" aria-label="Tablero"></div>
    <div class="result" id="result" hidden>
      <div class="result-card">
        <h2 id="resultTitle"></h2>
        <p id="resultText"></p>
        <button class="btn primary" id="rematch" type="button" data-i18n="rematch">Revancha</button>
      </div>
    </div>
  </div>

  <div class="strip" id="strip"></div>

  <nav class="controls">
    <button class="btn" id="undo" type="button" data-i18n="undo">Deshacer</button>
    <button class="btn" id="hints" type="button" aria-pressed="true" data-i18n="hints">Pistas</button>
    <button class="btn primary" id="newGame" type="button" data-i18n="newGame">Nueva partida</button>
  </nav>
</div>

<div class="sheet-bg" id="sheetBg" hidden>
  <form class="sheet" id="sheet">
    <h2 data-i18n="newGame">Nueva partida</h2>
    <fieldset class="field">
      <legend data-i18n="rival">Rival</legend>
      <div class="seg">
        <input type="radio" name="mode" id="mode-cpu" value="cpu"><label for="mode-cpu" data-i18n="vsCpu">Contra la CPU</label>
        <input type="radio" name="mode" id="mode-2p" value="2p"><label for="mode-2p" data-i18n="twoP">2 jugadores</label>
      </div>
    </fieldset>
    <fieldset class="field" id="levelField">
      <legend data-i18n="cpuLevel">Nivel de la CPU</legend>
      <div class="seg">
        <input type="radio" name="level" id="lvl-1" value="1"><label for="lvl-1" data-i18n="easy">Fácil</label>
        <input type="radio" name="level" id="lvl-2" value="2"><label for="lvl-2" data-i18n="medium">Medio</label>
        <input type="radio" name="level" id="lvl-3" value="3"><label for="lvl-3" data-i18n="hard">Difícil</label>
      </div>
    </fieldset>
    <fieldset class="field" id="colorField">
      <legend data-i18n="playAs">Juegas con</legend>
      <div class="seg">
        <input type="radio" name="color" id="col-1" value="1"><label for="col-1" data-i18n="blackFirst">Negras (empiezas)</label>
        <input type="radio" name="color" id="col-2" value="2"><label for="col-2" data-i18n="white">Blancas</label>
      </div>
    </fieldset>
    <fieldset class="field">
      <legend data-i18n="language">Idioma</legend>
      <select id="lang" class="lang"></select>
    </fieldset>
    <div class="sheet-actions">
      <button class="btn" type="button" id="cancel" data-i18n="cancel">Cancelar</button>
      <button class="btn primary" type="submit" data-i18n="start">Empezar</button>
    </div>
  </form>
</div>

    }
    boardEl.classList.toggle("hints", S.hints);
    $("hints").setAttribute("aria-pressed", String(S.hints));
    $("sound").setAttribute("aria-pressed", String(S.sound !== false));

    const nb = countOf(S.board, B), nw = countOf(S.board, W);
    $("c1").textContent = nb; $("c2").textContent = nw;
    $("p1").classList.toggle("active", !S.over && S.turn === B);
    $("p2").classList.toggle("active", !S.over && S.turn === W);
    const levelName = t({ 1: "easy", 2: "medium", 3: "hard" }[S.level]);
    if (S.mode === "cpu") {
      $("n1").textContent = S.human === B ? t("you") : t("cpu") + " · " + levelName;
      $("n2").textContent = S.human === W ? t("you") : t("cpu") + " · " + levelName;
      $("modeTag").textContent = t("vsCpu") + " · " + levelName;
    } else {
      $("n1").textContent = t("player1"); $("n2").textContent = t("player2");
      $("modeTag").textContent = "2 jugadores";
    }

    const st = $("status");
    st.classList.toggle("notice", typeof S.notice === "number");
    const notice = typeof S.notice === "number" ? t("passes")[S.notice - 1] + " " : "";
    const turnText = t(S.mode === "cpu" ? "yourTurn" : "turn")[S.turn - 1];
    if (S.over) st.textContent = t("gameOver");
    else if (isCpuTurn()) { st.textContent = notice + t("cpuThinks"); st.insertAdjacentHTML("beforeend", '<span class="dots"></span>'); }
    else st.textContent = notice + turnText;

    const strip = $("strip");
    strip.innerHTML = "";
    const lbl = document.createElement("span");
    lbl.className = "label"; lbl.textContent = t(S.log.length ? "moves" : "blackOpens");
    strip.appendChild(lbl);
    S.log.forEach((m, k) => {
      const el = document.createElement("span");
      el.className = "mv" + (m.pass ? " pass" : "");
      el.innerHTML = '<span class="chip ' + (m.p === B ? "b" : "w") + '"></span>' + (m.pass ? t("passShort") : (k + 1 - S.log.slice(0, k).filter(x => x.pass).length) + ". " + m.sq);
      strip.appendChild(el);
    });
    strip.scrollLeft = strip.scrollWidth;

    $("undo").disabled = !S.history.length || thinking;

    const res = $("result");
    res.hidden = !S.over;
    if (S.over) {
      let title;
      if (nb === nw) title = t("draw");
      else {
        const winner = nb > nw ? B : W;
        title = S.mode === "cpu" ? t(winner === S.human ? "youWin" : "cpuWins") : t("wins")[winner - 1];
      }
      $("resultTitle").textContent = title;
      $("resultText").textContent = t("black") + " " + nb + " – " + nw + " " + t("white");
    }
  }

  function play(i, flips) {
    S.history.push({ board: S.board.slice(), turn: S.turn, log: S.log.slice(), last: S.last, notice: S.notice });
    const p = S.turn;
    S.board[i] = p;
    const r0 = i >> 3, c0 = i & 7, delays = new Map();
    for (const f of flips) {
      S.board[f] = p;
      delays.set(f, (Math.max(Math.abs((f >> 3) - r0), Math.abs((f & 7) - c0)) - 1) * 70);
    }
    S.log.push({ p, sq: sq(i) });
    S.last = i;
    S.notice = "";
    const next = 3 - p;
    if (legalMoves(S.board, next).length) S.turn = next;
    else if (legalMoves(S.board, p).length) {
      S.notice = next;
      S.log.push({ p: next, pass: true });
    } else S.over = true;
    render({ placed: i, delays });
    clack(0, true);
    for (const t of delays.values()) clack(t + 330, false);
    save();
    scheduleCpu();
  }

  function humanPlay(i) {
    if (S.over || thinking || isCpuTurn()) return;
    const f = flipsFor(S.board, i, S.turn);
    if (f.length) play(i, f);
  }

  function scheduleCpu() {
    clearTimeout(cpuTimer);
    if (!isCpuTurn()) { thinking = false; return; }
    thinking = true;
    render();
    const started = Date.now();
    cpuTimer = setTimeout(() => {
      const m = cpuMove(S.board, S.turn, S.level);
      const wait = Math.max(0, 550 - (Date.now() - started));
      cpuTimer = setTimeout(() => { thinking = false; play(m.i, m.f); }, wait);
    }, 60);
  }

  function undo() {
    if (!S.history.length || thinking) return;
    let h = S.history.pop();
    while (S.mode === "cpu" && h.turn !== S.human && S.history.length) h = S.history.pop();
    Object.assign(S, h, { over: false });
    render();
    save();
    scheduleCpu();
  }

  function startGame(settings) {
    clearTimeout(cpuTimer); thinking = false;
    S = freshState(settings);
    render();
    save();
    scheduleCpu();
  }

  const sheetBg = $("sheetBg"), sheet = $("sheet");
  function syncSheet() {
    const cpu = sheet.elements.mode.value === "cpu";
    $("levelField").hidden = !cpu; $("colorField").hidden = !cpu;
  }
  function openSheet() {
    sheet.elements.mode.value = S.mode;
    sheet.elements.level.value = String(S.level);
    sheet.elements.color.value = String(S.human);
    syncSheet();
    sheetBg.hidden = false;
  }
  sheet.addEventListener("change", syncSheet);
  sheet.addEventListener("submit", e => {
    e.preventDefault();
    sheetBg.hidden = true;
    startGame({ mode: sheet.elements.mode.value, level: +sheet.elements.level.value, human: +sheet.elements.color.value, hints: S.hints, sound: S.sound });
  });
  $("cancel").addEventListener("click", () => { sheetBg.hidden = true; });
  sheetBg.addEventListener("click", e => { if (e.target === sheetBg) sheetBg.hidden = true; });
  document.addEventListener("keydown", e => { if (e.key === "Escape") sheetBg.hidden = true; });

  $("newGame").addEventListener("click", openSheet);
  $("rematch").addEventListener("click", () => startGame(S));
  $("undo").addEventListener("click", undo);
  $("hints").addEventListener("click", () => { S.hints = !S.hints; render(); save(); });
  $("sound").addEventListener("click", () => { S.sound = S.sound === false; render(); save(); });

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-aria]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
    $("lang").value = lang;
  }
  for (const [code, d] of Object.entries(I18N)) $("lang").add(new Option(d.name, code));
  $("lang").addEventListener("change", e => {
    lang = e.target.value;
    try { localStorage.setItem(LANG_KEY, lang); } catch (err) {}
    applyLang();
    render();
  });
  applyLang();

  function start(data) {
    const restored = (data && data.S) || load();
    if (restored) { S = restored; render(); scheduleCpu(); }
    else startGame({ mode: "cpu", level: 2, human: B, hints: true });
  }
  start({});
})();
</script>
